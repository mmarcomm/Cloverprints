<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ryanair Code Match</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0d0d1a;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      gap: 20px;
    }

    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #e94560;
      text-align: center;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: #1e1e3a;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #e94560;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    /* Red card */
    .red-card {
      width: 160px;
      height: 160px;
      background: #e94560;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      user-select: none;
      box-shadow: 0 0 30px #e9456055;
      touch-action: none;
      transition: transform 0.15s, box-shadow 0.15s, background 0.12s;
    }
    #code-label {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 4px;
      line-height: 1;
    }
    .red-card .hint {
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 1px;
      opacity: 0.75;
      margin-top: 6px;
    }
    .red-card.dragging {
      transform: scale(1.08);
      box-shadow: 0 0 40px #e9456099;
      cursor: grabbing;
    }
    .red-card.flash-green {
      background: #22c55e !important;
      box-shadow: 0 0 40px #22c55e88 !important;
    }

    /* Blue cards */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 500px;
    }

    .blue-card {
      background: #0f2044;
      border: 2px solid #1a2f5e;
      border-radius: 16px;
      padding: 18px 12px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s, background 0.12s;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .blue-card.highlight {
      border-color: #e94560;
      box-shadow: 0 0 20px #e9456066;
      transform: scale(1.03);
    }
    .blue-card.wrong {
      animation: shake 0.4s ease;
      border-color: #ff4444;
      background: #2a0f0f;
    }
    .blue-card.flash-green {
      background: #166534 !important;
      border-color: #22c55e !important;
      box-shadow: 0 0 20px #22c55e66 !important;
    }
    .blue-card.vanish {
      animation: pop-out 0.2s ease forwards;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-6px); }
      80%      { transform: translateX(6px); }
    }
    @keyframes pop-out {
      0%   { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0);    opacity: 0; }
    }

    /* Touch drag clone */
    .drag-clone {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      width: 130px;
      height: 130px;
      background: #e94560;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: white;
      opacity: 0.92;
      box-shadow: 0 8px 30px #e9456077;
      transform: scale(1.08);
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d0d1acc;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      z-index: 100;
    }
    .overlay.show { display: flex; }
    .overlay h2 { font-size: 2rem; }
    .overlay p  { opacity: 0.7; font-size: 1rem; }
    .overlay button {
      padding: 14px 36px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
    }
    .overlay button:hover { background: #c7304e; }
  </style>
</head>
<body>

  <header>
    <h1>✈ Ryanair Code Match</h1>
    <div class="score-row">
      <span>Score: <b id="score">0</b></span>
      <span><b id="remain">185</b> left</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  </header>

  <p style="opacity:.4; font-size:.78rem; text-align:center">Drag the code onto the correct city</p>

  <div class="red-card" id="red-card" draggable="true">
    <span id="code-label">---</span>
    <span class="hint">drag me</span>
  </div>

  <div class="options-grid" id="options"></div>

  <div class="overlay" id="overlay">
    <h2>🎉 All done!</h2>
    <p id="final-score"></p>
    <button onclick="startGame()">Play Again</button>
  </div>

  <script>
    // [code, city, region]
    const ALL = [
      ["DUB","Dublin","IE"],["ORK","Cork","IE"],["SNN","Shannon","IE"],
      ["NOC","Knock","IE"],["KIR","Kerry","IE"],
      ["STN","London Stansted","UK"],["LTN","London Luton","UK"],["LGW","London Gatwick","UK"],
      ["MAN","Manchester","UK"],["BHX","Birmingham","UK"],["EDI","Edinburgh","UK"],
      ["GLA","Glasgow","UK"],["BRS","Bristol","UK"],["LBA","Leeds Bradford","UK"],
      ["NCL","Newcastle","UK"],["LPL","Liverpool","UK"],["EMA","East Midlands","UK"],
      ["BFS","Belfast","UK"],["ABZ","Aberdeen","UK"],["CWL","Cardiff","UK"],
      ["BOH","Bournemouth","UK"],["INV","Inverness","UK"],["NQY","Newquay","UK"],
      ["LDY","Derry","UK"],["EXT","Exeter","UK"],
      ["MAD","Madrid","ES"],["BCN","Barcelona","ES"],["VLC","Valencia","ES"],
      ["SVQ","Seville","ES"],["AGP","Malaga","ES"],["ALC","Alicante","ES"],
      ["PMI","Palma","ES"],["IBZ","Ibiza","ES"],
      ["ACE","Lanzarote","ES_CAN"],["FUE","Fuerteventura","ES_CAN"],
      ["LPA","Gran Canaria","ES_CAN"],["TFS","Tenerife South","ES_CAN"],
      ["GRO","Girona","ES"],["REU","Reus","ES"],["SDR","Santander","ES"],
      ["BIO","Bilbao","ES"],["SCQ","Santiago de Compostela","ES"],["OVD","Asturias","ES"],
      ["LEI","Almeria","ES"],["GRX","Granada","ES"],["XRY","Jerez","ES"],["MAH","Menorca","ES"],
      ["LIS","Lisbon","PT"],["OPO","Porto","PT"],["FAO","Faro","PT"],
      ["FNC","Funchal","PT"],["PDL","Ponta Delgada","PT"],
      ["CIA","Rome Ciampino","IT"],["FCO","Rome Fiumicino","IT"],
      ["BGY","Milan Bergamo","IT"],["MXP","Milan Malpensa","IT"],
      ["NAP","Naples","IT"],["VCE","Venice","IT"],["BLQ","Bologna","IT"],
      ["BRI","Bari","IT"],["CTA","Catania","IT"],["PMO","Palermo","IT"],
      ["PSA","Pisa","IT"],["TRN","Turin","IT"],["BDS","Brindisi","IT"],
      ["SUF","Lamezia Terme","IT"],["TPS","Trapani","IT"],["AOI","Ancona","IT"],
      ["PSR","Pescara","IT"],["TRS","Trieste","IT"],["VRN","Verona","IT"],
      ["AHO","Alghero","IT"],["CAG","Cagliari","IT"],
      ["BVA","Paris Beauvais","FR"],["CDG","Paris CDG","FR"],
      ["MRS","Marseille","FR"],["NCE","Nice","FR"],["LYS","Lyon","FR"],
      ["BOD","Bordeaux","FR"],["TLS","Toulouse","FR"],["NTE","Nantes","FR"],
      ["SXB","Strasbourg","FR"],["MPL","Montpellier","FR"],["PGF","Perpignan","FR"],
      ["BIQ","Biarritz","FR"],["CCF","Carcassonne","FR"],["LRH","La Rochelle","FR"],
      ["LIG","Limoges","FR"],["GNB","Grenoble","FR"],["FNI","Nimes","FR"],
      ["BES","Brest","FR"],["CFE","Clermont-Ferrand","FR"],["TLN","Toulon","FR"],
      ["FRA","Frankfurt","DE"],["BER","Berlin","DE"],["MUC","Munich","DE"],
      ["CGN","Cologne Bonn","DE"],["HAM","Hamburg","DE"],["BRE","Bremen","DE"],
      ["DTM","Dortmund","DE"],["NUE","Nuremberg","DE"],["STR","Stuttgart","DE"],
      ["FMM","Memmingen","DE"],["NRN","Weeze","DE"],["LEJ","Leipzig","DE"],
      ["WMI","Warsaw Modlin","PL"],["KRK","Krakow","PL"],["GDN","Gdansk","PL"],
      ["KTW","Katowice","PL"],["WRO","Wroclaw","PL"],["POZ","Poznan","PL"],
      ["LUZ","Lublin","PL"],["RZE","Rzeszow","PL"],
      ["AMS","Amsterdam","NL"],["EIN","Eindhoven","NL"],
      ["CRL","Brussels Charleroi","BE"],["BRU","Brussels","BE"],
      ["PRG","Prague","CZ"],["BRQ","Brno","CZ"],["OSR","Ostrava","CZ"],
      ["BTS","Bratislava","SK"],["KSC","Kosice","SK"],
      ["BUD","Budapest","HU"],["DEB","Debrecen","HU"],
      ["VIE","Vienna","AT"],["SZG","Salzburg","AT"],["INN","Innsbruck","AT"],["GRZ","Graz","AT"],
      ["ATH","Athens","GR"],["SKG","Thessaloniki","GR"],["CFU","Corfu","GR"],
      ["RHO","Rhodes","GR"],["KGS","Kos","GR"],["HER","Heraklion","GR"],
      ["CHQ","Chania","GR"],["JTR","Santorini","GR"],["JMK","Mykonos","GR"],
      ["ZTH","Zakynthos","GR"],["EFL","Kefalonia","GR"],["JSI","Skiathos","GR"],
      ["ZAG","Zagreb","HR"],["SPU","Split","HR"],["DBV","Dubrovnik","HR"],
      ["ZAD","Zadar","HR"],["PUY","Pula","HR"],
      ["OTP","Bucharest","RO"],["CLJ","Cluj-Napoca","RO"],["TSR","Timisoara","RO"],
      ["IAS","Iasi","RO"],["SBZ","Sibiu","RO"],["CRA","Craiova","RO"],["BCM","Bacau","RO"],
      ["SOF","Sofia","BG"],["VAR","Varna","BG"],["BOJ","Burgas","BG"],
      ["BEG","Belgrade","RS"],["INI","Nis","RS"],
      ["SKP","Skopje","MK"],
      ["TIA","Tirana","AL"],
      ["SJJ","Sarajevo","BA"],["TZL","Tuzla","BA"],["BNX","Banja Luka","BA"],
      ["PRN","Pristina","XK"],
      ["TIV","Tivat","ME"],["TGD","Podgorica","ME"],
      ["LJU","Ljubljana","SI"],
      ["MLA","Malta","MT"],
      ["LCA","Larnaca","CY"],["PFO","Paphos","CY"],
      ["RAK","Marrakech","MA"],["AGA","Agadir","MA"],["FEZ","Fez","MA"],
      ["CMN","Casablanca","MA"],["TNG","Tangier","MA"],["RBA","Rabat","MA"],
      ["AMM","Amman","JO"],["TLV","Tel Aviv","IL"],
      ["VNO","Vilnius","LT"],["KUN","Kaunas","LT"],
      ["RIX","Riga","LV"],
      ["TLL","Tallinn","EE"],
      ["TMP","Tampere","FI"],["HEL","Helsinki","FI"],
      ["NYO","Stockholm Skavsta","SE"],
      ["SVG","Stavanger","NO"],["BGO","Bergen","NO"],
      ["CPH","Copenhagen","DK"],["BLL","Billund","DK"],
      ["TBS","Tbilisi","GE"]
    ];

    const TOTAL = ALL.length;
    let pool, answered, score, currentEntry, busy;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Re-shuffles every call so the same code never gets the same 3 decoys twice.
    // Prefers same-region airports to make the choice genuinely tricky.
    function pickDistractors(entry) {
      const [code, , region] = entry;
      const sameRegion  = shuffle(ALL.filter(d => d[0] !== code && d[2] === region));
      const otherRegion = shuffle(ALL.filter(d => d[0] !== code && d[2] !== region));
      return shuffle([...sameRegion.slice(0, 2), ...otherRegion].slice(0, 3));
    }

    function startGame() {
      pool     = shuffle([...ALL]);
      answered = 0;
      score    = 0;
      busy     = false;
      document.getElementById('overlay').classList.remove('show');
      nextRound();
    }

    function nextRound() {
      if (pool.length === 0) { endGame(); return; }
      currentEntry = pool.pop();
      answered++;
      busy = false;

      document.getElementById('code-label').textContent = currentEntry[0];
      document.getElementById('score').textContent      = score;
      document.getElementById('remain').textContent     = pool.length;
      document.getElementById('progress').style.width   = (answered / TOTAL * 100) + '%';

      const rc = document.getElementById('red-card');
      rc.style.transition = '';
      rc.style.transform  = '';
      rc.style.opacity    = '';
      rc.classList.remove('flash-green');

      // Fresh random distractors every round
      const opts = shuffle([currentEntry, ...pickDistractors(currentEntry)]);
      const grid = document.getElementById('options');
      grid.innerHTML = '';
      opts.forEach(([code, city]) => {
        const card = document.createElement('div');
        card.className    = 'blue-card';
        card.textContent  = city;
        card.dataset.code = code;
        card.addEventListener('click', () => tryMatch(card));
        grid.appendChild(card);
      });
    }

    function tryMatch(card) {
      if (busy) return;
      if (card.dataset.code === currentEntry[0]) {
        busy = true;
        score++;
        document.getElementById('score').textContent = score;

        // Flash both green for 200 ms, then vanish
        const rc = document.getElementById('red-card');
        card.classList.add('flash-green');
        rc.classList.add('flash-green');

        setTimeout(() => {
          card.classList.remove('flash-green');
          card.classList.add('vanish');
          rc.style.transition = 'transform 0.2s, opacity 0.2s';
          rc.style.transform  = 'scale(0)';
          rc.style.opacity    = '0';
          setTimeout(nextRound, 220);
        }, 200);

      } else {
        card.classList.add('wrong');
        setTimeout(() => card.classList.remove('wrong'), 450);
      }
    }

    function endGame() {
      document.getElementById('final-score').textContent =
        `You scored ${score} out of ${TOTAL}!`;
      document.getElementById('overlay').classList.add('show');
    }

    // ── Desktop drag ──────────────────────────────────────────────
    const redCard = document.getElementById('red-card');

    redCard.addEventListener('dragstart', e => {
      redCard.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    redCard.addEventListener('dragend', () => {
      redCard.classList.remove('dragging');
      document.querySelectorAll('.blue-card').forEach(c => c.classList.remove('highlight'));
    });

    const optionsEl = document.getElementById('options');
    optionsEl.addEventListener('dragover', e => {
      e.preventDefault();
      const card = e.target.closest('.blue-card');
      document.querySelectorAll('.blue-card').forEach(c => c.classList.remove('highlight'));
      if (card) card.classList.add('highlight');
    });
    optionsEl.addEventListener('dragleave', e => {
      if (!optionsEl.contains(e.relatedTarget))
        document.querySelectorAll('.blue-card').forEach(c => c.classList.remove('highlight'));
    });
    optionsEl.addEventListener('drop', e => {
      e.preventDefault();
      const card = e.target.closest('.blue-card');
      document.querySelectorAll('.blue-card').forEach(c => c.classList.remove('highlight'));
      if (card) tryMatch(card);
    });

    // ── Mobile touch ──────────────────────────────────────────────
    let dragClone = null, touchOffX = 0, touchOffY = 0;

    redCard.addEventListener('touchstart', e => {
      if (busy) return;
      const t = e.touches[0];
      const rect = redCard.getBoundingClientRect();
      touchOffX = t.clientX - rect.left;
      touchOffY = t.clientY - rect.top;

      dragClone = document.createElement('div');
      dragClone.className   = 'drag-clone';
      dragClone.textContent = currentEntry[0];
      dragClone.style.left  = (t.clientX - touchOffX) + 'px';
      dragClone.style.top   = (t.clientY - touchOffY) + 'px';
      document.body.appendChild(dragClone);
      redCard.style.opacity = '0.3';
    }, { passive: true });

    redCard.addEventListener('touchmove', e => {
      if (!dragClone) return;
      e.preventDefault();
      const t = e.touches[0];
      dragClone.style.left = (t.clientX - touchOffX) + 'px';
      dragClone.style.top  = (t.clientY - touchOffY) + 'px';

      document.querySelectorAll('.blue-card').forEach(card => {
        const r = card.getBoundingClientRect();
        card.classList.toggle('highlight',
          t.clientX >= r.left && t.clientX <= r.right &&
          t.clientY >= r.top  && t.clientY <= r.bottom);
      });
    }, { passive: false });

    redCard.addEventListener('touchend', e => {
      if (!dragClone) return;
      const t = e.changedTouches[0];
      dragClone.remove(); dragClone = null;
      redCard.style.opacity = '1';

      document.querySelectorAll('.blue-card').forEach(card => {
        card.classList.remove('highlight');
        const r = card.getBoundingClientRect();
        if (t.clientX >= r.left && t.clientX <= r.right &&
            t.clientY >= r.top  && t.clientY <= r.bottom) {
          tryMatch(card);
        }
      });
    });

    startGame();
  </script>
</body>
</html>
