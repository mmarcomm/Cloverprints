<!DOCTYPE html>
<html lang="pt-PT">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="styles.css" rel="stylesheet" type="text/css">
    <link href="css/header.css" rel="stylesheet" type="text/css">
        <link rel="stylesheet" href="https://use.typekit.net/uhg8sos.css">
		<link rel="stylesheet" href="https://use.typekit.net/yiz2qnq.css">
        <title>Produtos — Cloverprints</title>
		<link rel="icon" href="SGVs/M.svg" type="image/x-icon" />
    </head>
    <body>
        <header id="header-placeholder"></header>
    <!-- Hero Banner -->
    <div class="banner">
        <div class="banner__inner">
            <span class="banner__eyebrow">Coleção 2026</span>
            <h1 class="banner__heading">Design<br>Independente</h1>
            <p class="banner__sub">Peças em algodão, edição limitada.<br>Peças feitas para partilhar histórias.</p>
        </div>
    </div>


    <!-- Product Grid -->
    <section class="product-section" id="produtos">
        <div class="product-container">
            <div class="section-header">
                <h2 class="section-title">Produtos</h2>
                <span class="section-badge">Edição Limitada</span>
            </div>
            <div class="product-grid" id="product-grid">
                <!-- preenchido dinamicamente via products.json -->
            </div>
        </div>
    </section>
    <div id="footer-placeholder"></div>
	<script src="main.js"></script>
</body>
</html>
